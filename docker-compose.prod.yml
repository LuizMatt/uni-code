# Docker Compose de Produção para UniCode (Coolify / VPS)
name: unicode

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_seguro_troque_aqui}
      UNICODE_OWNER_PASSWORD: ${UNICODE_OWNER_PASSWORD:-owner_seguro_troque_aqui}
      UNICODE_DAEMON_PASSWORD: ${UNICODE_DAEMON_PASSWORD:-daemon_seguro_troque_aqui}
      UNICODE_PANEL_PASSWORD: ${UNICODE_PANEL_PASSWORD:-panel_seguro_troque_aqui}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposto em 127.0.0.1 para permitir que o unicode-daemon e unicode-admin no host se conectem
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UNICODE_PANEL_DATABASE_URL: postgresql://unicode_panel:${UNICODE_PANEL_PASSWORD:-panel_seguro_troque_aqui}@postgres:5432/unicode
      UNICODE_ADMIN_EMAIL: ${UNICODE_ADMIN_EMAIL:-admin@unicode.local}
      UNICODE_ADMIN_PASSWORD: ${UNICODE_ADMIN_PASSWORD:-troque_esta_senha_em_prod}
      UNICODE_WEB_DIST_DIR: /app/web/dist
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/overview || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

