# Development database only. Production provisioning: docs/architecture/database.md
name: unicode

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      UNICODE_OWNER_PASSWORD: unicode_owner
      UNICODE_DAEMON_PASSWORD: unicode_daemon
      UNICODE_PANEL_PASSWORD: unicode_panel
    ports:
      - "${UNICODE_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
